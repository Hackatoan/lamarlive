# Publicly reachable gallery with no auth in front of it. 20 req/s per client IP
# with a generous burst covers normal browsing (page + assets) while curbing
# basic scraping/DoS floods against the vhost. Does not throttle the Discord
# /build pipeline itself (that writes to disk server-side, not through here).
limit_req_zone $binary_remote_addr zone=lamarlive:10m rate=20r/s;

server {
    listen 80;
    root /usr/share/nginx/html;   # static shell baked into the image (index.html)
    index index.html;
    error_page 404 /404.html;     # branded fallback for expired/mistyped /u/<user> links

    # sendfile is on by default (base image), but tcp_nopush is off. With it
    # enabled, nginx fills a full TCP segment with the response header plus
    # the start of the file before sending, instead of pushing the header
    # packet immediately. Fewer packets per response, which adds up given
    # how many small generated files /u/ serves. No change in response
    # content, just how it's packetized on the wire.
    tcp_nopush on;

    limit_req zone=lamarlive burst=40 nodelay;
    limit_req_status 429;

    # Cache open file descriptors + stat() results for the static file tree.
    # /u/ holds many small generated files (README-noted above), each request
    # currently re-stats/open()s from disk; this skips that for files seen
    # recently. Entries are still periodically re-validated against disk, so
    # a rebuilt /build page or a redeployed shell is picked up within
    # open_file_cache_valid — no change in what's served, just fewer syscalls.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Baseline hardening: /u/ serves arbitrary pages generated by the Discord
    # /build pipeline, so browsers get explicit MIME/framing/permission
    # defaults instead of trusting whatever a generated page omits.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # Site is only ever reachable through the HTTPS-terminating reverse proxy;
    # tell browsers to skip plaintext HTTP for this host on repeat visits.
    # No includeSubDomains/preload: scoped to this host only, not the wildcard.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Compress text-based responses. The gallery serves many small generated
    # HTML/CSS/JS/SVG pages under /u/, so this cuts bytes-over-the-wire on
    # every page load with no change in served content (Content-Encoding is
    # negotiated per-request via Accept-Encoding).
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dynamic content served from the host data mount (/opt/homelab/lamarlive -> /data):
    # user builds written by lamarlive-builder, and the runtime-regenerated sitemap.
    location /u/ {
        root /data;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /sitemap.xml {
        root /data;
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
