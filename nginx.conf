server {
    listen 80;
    root /usr/share/nginx/html;   # static shell baked into the image (index.html)
    index index.html;
    error_page 404 /404.html;     # branded fallback for expired/mistyped /u/<user> links

    # Baseline hardening: /u/ serves arbitrary pages generated by the Discord
    # /build pipeline, so browsers get explicit MIME/framing/permission
    # defaults instead of trusting whatever a generated page omits.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # Site is only ever reachable through the HTTPS-terminating reverse proxy;
    # tell browsers to skip plaintext HTTP for this host on repeat visits.
    # No includeSubDomains/preload: scoped to this host only, not the wildcard.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Compress text-based responses. The gallery serves many small generated
    # HTML/CSS/JS/SVG pages under /u/, so this cuts bytes-over-the-wire on
    # every page load with no change in served content (Content-Encoding is
    # negotiated per-request via Accept-Encoding).
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dynamic content served from the host data mount (/opt/homelab/lamarlive -> /data):
    # user builds written by lamarlive-builder, and the runtime-regenerated sitemap.
    location /u/ {
        root /data;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /sitemap.xml {
        root /data;
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
